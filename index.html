<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#6366F1" />
    <meta name="description" content="MyQuizz: gratis quiz- en flashcard-app. Alles lokaal in je browser, deelbaar met collega's, offline te gebruiken." />
    <meta property="og:title" content="MyQuizz" />
    <meta property="og:description" content="Gratis quiz- en flashcard-app. Lokaal, deelbaar, offline." />
    <meta property="og:image" content="og.png" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>MyQuizz</title>
    <script>
      // Apply stored theme before first paint to avoid flashing.
      try {
        var t = localStorage.getItem('myquizz.theme');
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
