<!doctype html><html><head><meta charset="utf-8"><title>MyQuizz</title><script>
// GitHub Pages fallback: send unknown paths to the hash router.
var p = location.pathname.replace(/^\/MyQuiz\/?/, '');
location.replace(location.origin + '/MyQuiz/' + (p ? '#/' + p : '') + location.search + location.hash);
</script></head><body></body></html>
